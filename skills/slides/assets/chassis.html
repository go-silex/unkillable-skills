<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DECK_TITLE}}</title>
<!-- WEB FONTS (optional). Replace {{FONTS_URL}} with a Google Fonts css2 URL
     (https://fonts.googleapis.com/css2?family=...&display=swap), or delete the
     <link> line below to use the system fallback stack. -->
<link rel="stylesheet" href="{{FONTS_URL}}">
<style>
/* =====================================================================
   BRAND TOKENS: the only block to edit per brand (values from Brand_Kit.md).
   Everything below reads these variables. Keep the fallback font stacks.
   ===================================================================== */
:root {
  --bg: #ffffff;           /* slide background */
  --surface: #f3f4f6;      /* cards, panels, image placeholder: one step away from --bg */
  --ink: #111827;          /* main text, aim for 7:1 or more on --bg */
  --ink-soft: #4b5563;     /* secondary text, at least 4.5:1 on --bg */
  --accent: #2563eb;       /* the brand color, used once per slide */
  --accent-ink: #ffffff;   /* text on --accent, at least 4.5:1 on --accent */
  --line: #d1d5db;         /* hairlines, rules, borders */
  --font-display: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 16px;          /* 0 for square brands, 8 to 24px otherwise */
  --logo-filter: none;     /* brightness(0) invert(1) turns a dark one-color logo white on a dark --bg */
  /* optional fine tuning of the display font */
  --display-weight: 700;   /* 600 to 800 for sans, 400 to 600 for serif */
  --display-tracking: -0.02em;
}
/* ===================== END OF BRAND TOKENS ===================== */

/* Layout constants (do not change per brand) */
:root { --pad-x: 128px; --pad-top: 112px; --pad-bottom: 144px; --letterbox: #0d0d0f; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--letterbox); }
body { font-family: var(--font-body); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

/* ---------- Fixed 1920x1080 stage, scaled to the window by JS ---------- */
.deck-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: var(--bg); }
.slide {
  position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
  display: flex; flex-direction: column;
  padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
  background: var(--bg); color: var(--ink);
  font-size: 32px; line-height: 1.4;
  visibility: hidden; opacity: 0; transition: opacity .35s ease, visibility 0s linear .35s;
}
.slide.active { visibility: visible; opacity: 1; z-index: 1; transition: opacity .35s ease; }
.deck-stage:not(.ready) > .slide:first-of-type { visibility: visible; opacity: 1; }
.no-anim .slide, .no-anim .deck-progress { transition: none !important; }
img { display: block; max-width: 100%; }

/* ---------- Shared type ---------- */
.kicker { font: 600 24px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 28px; }
.title {
  font-family: var(--font-display); font-weight: var(--display-weight); letter-spacing: var(--display-tracking);
  font-size: 80px; line-height: 1.06; max-width: 1500px; text-wrap: balance; overflow-wrap: break-word;
}
.lead { font-size: 36px; line-height: 1.4; color: var(--ink-soft); max-width: 1300px; margin-top: 32px; text-wrap: pretty; }
.head { margin-bottom: 72px; flex: none; }
h3 { font-family: var(--font-display); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); font-size: 44px; line-height: 1.15; }
b, strong { font-weight: 650; color: inherit; }
.label { font: 600 22px/1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }

/* ---------- Accent slide variant (section divider by default) ---------- */
.on-accent { background: var(--accent); color: var(--accent-ink); }
.on-accent .kicker, .on-accent .lead, .on-accent .label { color: inherit; }
.on-accent .kicker { opacity: .85; }

/* ---------- Footer injected by JS on every slide but the cover ---------- */
.slide-foot { position: absolute; left: var(--pad-x); right: var(--pad-x); bottom: 48px; height: 48px; display: flex; align-items: center; gap: 28px; font-size: 20px; color: var(--ink-soft); }
.slide-foot .brand-mark { height: 36px; width: auto; max-width: 200px; object-fit: contain; }
.slide-foot .page { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.on-accent .slide-foot { color: var(--accent-ink); }
.on-accent .brand-mark, .s-closing .brand-mark { display: none; }
img.brand-logo[src=""], img.brand-mark[src=""] { display: none; }

/* ---------- 1. Cover ---------- */
.s-cover { padding-top: 96px; }
.brand-logo, .brand-mark { filter: var(--logo-filter); }
.s-cover .brand-logo { height: 88px; width: auto; max-width: 420px; object-fit: contain; object-position: left center; flex: none; }
.cover-main { margin-block: auto; max-width: 1560px; }
.cover-bar { width: 160px; height: 14px; background: var(--accent); border-radius: min(7px, var(--radius)); margin-bottom: 56px; }
.s-cover .title { font-size: 128px; line-height: 1; max-width: 1560px; }
.s-cover .lead { font-size: 40px; margin-top: 40px; }
.cover-meta { display: flex; gap: 64px; flex: none; font-size: 26px; color: var(--ink-soft); border-top: 2px solid var(--line); padding-top: 32px; }

/* ---------- 2. Section divider ---------- */
.s-section { justify-content: flex-end; }
.s-section .section-num {
  position: absolute; top: 72px; right: var(--pad-x);
  font: var(--display-weight) 360px/1 var(--font-display); letter-spacing: -.04em; opacity: .22; font-variant-numeric: tabular-nums;
}
.s-section .title { font-size: 120px; line-height: 1.02; }
.s-section .lead { max-width: 1100px; }

/* ---------- 3. Statement ---------- */
.s-statement { justify-content: center; }
.statement {
  font-family: var(--font-display); font-weight: var(--display-weight); letter-spacing: var(--display-tracking);
  font-size: 96px; line-height: 1.12; max-width: 1560px; text-wrap: balance;
}
.statement .accent {
  background: linear-gradient(transparent 66%, var(--accent) 66%, var(--accent) 90%, transparent 90%);
  padding: 0 .06em; -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.s-statement .source { margin-top: 56px; font-size: 28px; color: var(--ink-soft); }

/* ---------- 4. Bullets ---------- */
.bullets { list-style: none; display: flex; flex-direction: column; gap: 30px; max-width: 1440px; }
.bullets li { position: relative; padding-left: 60px; font-size: 38px; line-height: 1.35; }
.bullets li::before { content: ""; position: absolute; left: 0; top: .48em; width: 18px; height: 18px; background: var(--ink); border-radius: min(4px, var(--radius)); }
.bullets li.accent::before { background: var(--accent); width: 22px; height: 22px; top: .44em; }
.bullets li span { color: var(--ink-soft); }

/* ---------- 5. Two columns ---------- */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 112px; }
.col { border-top: 4px solid var(--line); padding-top: 44px; }
.col.accent { border-top: 12px solid var(--accent); padding-top: 36px; }
.col .label { margin-bottom: 20px; }
.col h3 { margin-bottom: 24px; }
.col p { font-size: 30px; color: var(--ink-soft); }
.col ul { list-style: none; margin-top: 28px; display: flex; flex-direction: column; gap: 16px; }
.col li { position: relative; padding-left: 36px; font-size: 30px; }
.col li::before { content: ""; position: absolute; left: 0; top: .55em; width: 12px; height: 12px; background: var(--ink-soft); border-radius: min(3px, var(--radius)); }

/* ---------- 6. Three cards ---------- */
.cards { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 40px; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 56px 48px; display: flex; flex-direction: column; gap: 20px; min-height: 440px; }
.card p { font-size: 28px; color: var(--ink-soft); }
.card .label { margin-bottom: auto; padding-bottom: 40px; }
.card.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.card.accent p, .card.accent .label { color: inherit; }

/* ---------- 7. Big numbers ---------- */
.s-numbers .stats { margin-block: auto; }
.stats { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 64px; }
.stat::before { content: ""; display: block; height: 4px; background: var(--line); margin-bottom: 48px; }
.stat.accent::before { height: 12px; background: var(--accent); margin-bottom: 40px; }
.stat .num {
  display: block; font-family: var(--font-display); font-weight: var(--display-weight);
  font-size: 168px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.stat p { font-size: 30px; color: var(--ink-soft); margin-top: 28px; max-width: 480px; }

/* ---------- 8. Quote ---------- */
.s-quote { justify-content: center; }
.quote { max-width: 1520px; }
.qmark { display: block; height: 120px; font: 700 260px/1 Georgia, "Times New Roman", serif; }
.qmark.accent { color: var(--accent); }
.quote blockquote { font-family: var(--font-display); font-weight: 500; letter-spacing: var(--display-tracking); font-size: 64px; line-height: 1.25; text-wrap: balance; }
.quote figcaption { margin-top: 56px; font-size: 28px; color: var(--ink-soft); }
.quote figcaption b { display: block; font-size: 32px; color: var(--ink); margin-bottom: 4px; }

/* ---------- 9. Image + text ---------- */
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 112px; align-items: center; }
.split .media { height: 100%; min-height: 0; border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.split .media img { width: 100%; height: 100%; object-fit: cover; }
.split.reverse .media { order: -1; }
.split .title { font-size: 72px; }
.split .lead { font-size: 32px; }

/* ---------- 10. Steps / timeline ---------- */
.s-steps .steps { margin-block: auto; }
.steps { list-style: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 48px; position: relative; }
.steps::before { content: ""; position: absolute; left: 20px; right: 0; top: 19px; height: 3px; background: var(--line); }
.step { position: relative; padding-top: 88px; }
.step::before { content: ""; position: absolute; top: 0; left: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--bg); border: 4px solid var(--ink); }
.step.accent::before { background: var(--accent); border-color: var(--accent); }
.step h3 { font-size: 40px; margin: 14px 0 16px; }
.step p { font-size: 26px; color: var(--ink-soft); }

/* ---------- 11. Table ---------- */
.table { width: 100%; border-collapse: collapse; font-size: 28px; line-height: 1.3; }
.table th { text-align: left; font: 600 22px/1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); padding: 0 28px 22px; border-bottom: 3px solid var(--ink); }
.table td { padding: 26px 28px; border-bottom: 2px solid var(--line); vertical-align: top; }
.table td:first-child { font-weight: 650; }
.table .n { text-align: right; font-variant-numeric: tabular-nums; }
.table tr.accent td { background: var(--accent); color: var(--accent-ink); border-bottom-color: var(--accent); }

/* ---------- 12. Closing ---------- */
.s-closing { justify-content: center; }
.s-closing .brand-logo { height: 72px; width: auto; max-width: 360px; object-fit: contain; object-position: left center; margin-bottom: 72px; }
.s-closing .title { font-size: 112px; line-height: 1.02; }
.cta { display: inline-block; align-self: flex-start; margin-top: 56px; padding: 24px 44px; background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); font-size: 32px; font-weight: 650; text-decoration: none; }
.contact { display: flex; gap: 96px; margin-top: 80px; padding-top: 36px; border-top: 2px solid var(--line); font-size: 30px; }
.contact .label { display: block; margin-bottom: 8px; }

/* ---------- Presentation chrome (outside the stage) ---------- */
.deck-progress { position: fixed; left: 0; top: 0; width: 100%; height: 4px; background: var(--accent); transform-origin: 0 0; transform: scaleX(0); transition: transform .35s ease; z-index: 10; }
.debug .slide[data-overflow] { outline: 8px solid #e11d48; outline-offset: -8px; }

/* ---------- Print to PDF: one 16:9 slide per page ---------- */
@page { size: 1920px 1080px; margin: 0; }
@media print {
  html, body { width: 1920px; height: auto; overflow: visible; background: none; }
  .deck-stage { position: static; width: 1920px; height: auto; overflow: visible; transform: none !important; background: none; }
  .slide {
    position: relative; visibility: visible !important; opacity: 1 !important; transition: none !important;
    break-after: page; page-break-after: always; break-inside: avoid;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .slide:last-of-type { break-after: auto; page-break-after: auto; }
  .deck-progress { display: none; }
}
@media (prefers-reduced-motion: reduce) { .slide, .deck-progress { transition: none !important; } }
</style>
</head>
<body>
<!-- Logo source for the small mark in each slide footer. Empty src = no mark. -->
<img id="brandMark" src="{{LOGO}}" alt="" hidden>

<main class="deck-stage" data-footer="{{FOOTER}}">
<!-- SLIDES -->
</main>
<div class="deck-progress" aria-hidden="true"></div>

<script>
/* Deck controller: scale, navigation, footer, deep links (#3 or ?slide=3), overflow check. */
(() => {
  const W = 1920, H = 1080;
  const stage = document.querySelector('.deck-stage');
  const slides = [...stage.querySelectorAll(':scope > .slide')];
  const n = slides.length, bar = document.querySelector('.deck-progress');
  const pad = i => String(i).padStart(2, '0');
  const usable = src => !!src && !src.includes('{{');

  /* Logos: hide any logo with an empty, unfilled or broken src */
  document.querySelectorAll('img.brand-logo').forEach(img => {
    const off = () => { img.hidden = true; };
    if (!usable(img.getAttribute('src'))) off();
    else { img.addEventListener('error', off); if (img.complete && !img.naturalWidth) off(); }
  });

  /* Footer: logo mark, optional footer text, page number. Skipped on the cover and on data-nofoot. */
  const markSrc = (document.getElementById('brandMark') || {}).getAttribute?.('src') || '';
  const footText = usable(stage.dataset.footer) ? stage.dataset.footer : '';
  slides.forEach((s, i) => {
    if (s.classList.contains('s-cover') || s.hasAttribute('data-nofoot')) return;
    const f = document.createElement('footer');
    f.className = 'slide-foot';
    if (usable(markSrc)) {
      const m = new Image(); m.className = 'brand-mark'; m.alt = ''; m.src = markSrc;
      m.addEventListener('error', () => { m.hidden = true; });
      f.append(m);
    }
    if (footText) { const t = document.createElement('span'); t.className = 'foot-text'; t.textContent = footText; f.append(t); }
    const p = document.createElement('span'); p.className = 'page'; p.textContent = pad(i + 1) + ' / ' + pad(n); f.append(p);
    s.append(f);
  });

  /* Scale the 1920x1080 stage to the window (letterbox) */
  const fit = () => {
    const k = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = `translate(${(innerWidth - W * k) / 2}px, ${(innerHeight - H * k) / 2}px) scale(${k})`;
  };
  fit(); addEventListener('resize', fit);

  /* Show one slide */
  let idx = 0;
  const show = (i, write = true) => {
    if (!n) return;
    idx = Math.max(0, Math.min(n - 1, i));
    slides.forEach((s, k) => s.classList.toggle('active', k === idx));
    if (bar) bar.style.transform = `scaleX(${(idx + 1) / n})`;
    if (write) try { history.replaceState(null, '', '#' + (idx + 1)); } catch (e) {}
  };
  const fromUrl = () => {
    const q = parseInt(new URLSearchParams(location.search).get('slide'), 10);
    const h = parseInt(location.hash.slice(1), 10);
    return (isNaN(h) ? (isNaN(q) ? 1 : q) : h) - 1;
  };
  const root = document.documentElement;
  root.classList.add('no-anim');
  show(fromUrl(), false);
  stage.classList.add('ready');
  setTimeout(() => root.classList.remove('no-anim'), 400);
  addEventListener('hashchange', () => { const i = fromUrl(); if (i !== idx) show(i, false); });

  /* Keyboard, wheel-free on purpose (trackpads skip slides) */
  addEventListener('keydown', e => {
    const t = e.target;
    if (e.metaKey || e.ctrlKey || e.altKey || t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || (k === ' ' && !e.shiftKey)) { e.preventDefault(); show(idx + 1); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || (k === ' ' && e.shiftKey)) { e.preventDefault(); show(idx - 1); }
    else if (k === 'Home') { e.preventDefault(); show(0); }
    else if (k === 'End') { e.preventDefault(); show(n - 1); }
    else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
  });

  /* Touch swipe */
  let x0 = 0, y0 = 0;
  addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(idx + (dx < 0 ? 1 : -1));
  });

  /* Overflow check: flags content that leaves the safe area (data-overflow + console warning).
     Add ?debug to the URL to outline flagged slides in red. */
  const check = () => slides.forEach((s, i) => {
    const r = s.getBoundingClientRect(), k = r.width / W || 1;
    const bad = [...s.querySelectorAll('*')].some(el => {
      if (el.closest('.slide-foot')) return false;
      const b = el.getBoundingClientRect();
      if (!b.width || !b.height) return false;
      return (b.bottom - r.top) / k > H - 104 || (b.right - r.left) / k > W - 88 || (b.left - r.left) / k < 88 && !el.closest('.s-section .section-num');
    });
    if (bad) { s.dataset.overflow = '1'; console.warn('Slide ' + (i + 1) + ' overflows its safe area'); }
    else delete s.dataset.overflow;
  });
  if (/[?&]debug\b/.test(location.search)) stage.classList.add('debug');
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(check);
})();
</script>
</body>
</html>
